name: Build Windows Desktop EXE Setup

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Manual 1-Click Run from GitHub Actions tab
  release:
    types: [ published ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract ZIP & Prepare Workspace (If repo contains uploaded ZIP)
        shell: bash
        run: |
          shopt -s nullglob
          for f in *.zip; do
            echo "Auto-extracting: $f..."
            unzip -o "$f" || true
          done

          for dir in */; do
            if [ -f "${dir}package.json" ]; then
              echo "Moving ${dir} to root..."
              cp -rf "${dir}"* . 2>/dev/null || true
            fi
          done

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --save-dev electron electron-packager --legacy-peer-deps

      - name: Build Web Application Assets
        run: |
          npm run build

      - name: Package Windows .EXE Application
        run: |
          npx electron-packager . "Muzammil Online service pc" --platform=win32 --arch=x64 --out=dist-exe --overwrite --prune=true

      - name: Compress Executable Folder to ZIP
        shell: bash
        run: |
          cd dist-exe
          zip -r ../Muzammil-Online-Service-Windows-x64-v3.zip "Muzammil Online service pc-win32-x64"
          cd ..

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-Windows-x64-v3
          path: Muzammil-Online-Service-Windows-x64-v3.zip
          retention-days: 30

      - name: Upload to GitHub Release (If Tagged)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Muzammil-Online-Service-Windows-x64-v3.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
