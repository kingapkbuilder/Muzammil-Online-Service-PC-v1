name: Build Muzammil Online Service Windows Setup

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Native Project ZIP
        shell: powershell
        run: |
          $zip = Get-ChildItem -Path . -Recurse -Filter "Muzammil_Online_Service_PC_Final_Windows_Project.zip" |
            Select-Object -First 1

          if (-not $zip) {
            Write-Host "ERROR: Native project ZIP nahi mila."
            Get-ChildItem -Path . -Recurse -Filter "*.zip"
            exit 1
          }

          "PC_ZIP=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Found: $($zip.FullName)"

      - name: Extract Native Project
        shell: powershell
        run: |
          if (Test-Path "pc_project") { Remove-Item "pc_project" -Recurse -Force }
          New-Item -ItemType Directory -Path "pc_project" | Out-Null
          Expand-Archive -Path "$env:PC_ZIP" -DestinationPath "pc_project" -Force

          $main = Get-ChildItem -Path "pc_project" -Recurse -Filter "main.cpp" | Select-Object -First 1
          if (-not $main) {
            Write-Host "ERROR: main.cpp nahi mila."
            Get-ChildItem "pc_project" -Recurse
            exit 1
          }

          $root = $main.Directory.Parent.FullName
          "PC_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Actual project root: $root"

      - name: Verify Project
        shell: powershell
        run: |
          $required = @(
            "$env:PC_ROOT\src\main.cpp",
            "$env:PC_ROOT\python\pdf_to_jpg.py",
            "$env:PC_ROOT\installer\MuzammilOnlineService.iss"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              Write-Host "ERROR: Missing $file"
              exit 1
            }
          }
          Write-Host "Project structure OK."

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Clean Build
        shell: powershell
        run: |
          $build = Join-Path $env:PC_ROOT "build"
          $dist = Join-Path $env:PC_ROOT "dist"
          $out = Join-Path $env:PC_ROOT "installer\installer_output"
          if (Test-Path $build) { Remove-Item $build -Recurse -Force }
          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Path $build -Force | Out-Null

      - name: Build Native C++ Application
        shell: powershell
        run: |
          Set-Location $env:PC_ROOT
          cl.exe /nologo /std:c++17 /O2 /EHsc /DUNICODE /D_UNICODE `
            "src\main.cpp" `
            /Fe:"build\Muzammil Online Service.exe" `
            /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib shell32.lib comdlg32.lib

          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "build\Muzammil Online Service.exe")) { exit 1 }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install PyMuPDF pyinstaller

      - name: Build Python PDF Engine
        shell: powershell
        run: |
          Set-Location $env:PC_ROOT
          python -m py_compile "python\pdf_to_jpg.py"
          pyinstaller --noconfirm --clean --onefile --name "pdf_to_jpg" "python\pdf_to_jpg.py"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "dist\pdf_to_jpg.exe")) { exit 1 }
          Copy-Item "dist\pdf_to_jpg.exe" "build\pdf_to_jpg.exe" -Force

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { exit 1 }

      - name: Build Windows Installer
        shell: powershell
        run: |
          Set-Location $env:PC_ROOT
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\MuzammilOnlineService.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verify Setup
        shell: powershell
        run: |
          Set-Location $env:PC_ROOT
          $setup = Get-ChildItem "installer\installer_output" -Filter "*.exe" | Select-Object -First 1
          if (-not $setup) { Get-ChildItem "installer" -Recurse; exit 1 }
          Copy-Item $setup.FullName "$env:GITHUB_WORKSPACE\Muzammil-Online-Service-Setup.exe" -Force
          Get-Item "$env:GITHUB_WORKSPACE\Muzammil-Online-Service-Setup.exe" | Format-List Name,Length,FullName

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-Windows-Setup
          path: Muzammil-Online-Service-Setup.exe
          if-no-files-found: error

      - name: Upload Native EXE
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-Native-EXE
          path: ${{ env.PC_ROOT }}\build\Muzammil Online Service.exe
          if-no-files-found: error
