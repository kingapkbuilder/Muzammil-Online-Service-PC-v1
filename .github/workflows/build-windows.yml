name: Build Windows Desktop EXE Setup

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          npm install --save-dev electron electron-packager

      - name: Build Web Application Assets
        run: npm run build

      - name: Package Windows .EXE Application
        run: |
          npx electron-packager . "Muzammil Online service pc" --platform=win32 --arch=x64 --out=dist-exe --overwrite --icon=public/favicon.ico

      - name: Compress Executable Folder to ZIP
        run: |
          Compress-Archive -Path "dist-exe\Muzammil Online service pc-win32-x64\*" -DestinationPath "Muzammil-Online-Service-Windows-x64.zip"

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-Windows-x64
          path: Muzammil-Online-Service-Windows-x64.zip
          retention-days: 30
