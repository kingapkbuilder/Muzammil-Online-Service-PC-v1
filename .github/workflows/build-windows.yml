name: Build Muzammil Online Service PC

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }
          pip install pyinstaller

      - name: Check project
        shell: powershell
        run: |
          Write-Host "Project files:"
          Get-ChildItem -Recurse -File |
            Select-Object -First 100 FullName

      - name: Test Python
        shell: powershell
        run: |
          python -m py_compile main.py

      - name: Build Windows EXE
        shell: powershell
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name "Muzammil Online Service" `
            --onedir `
            main.py

      - name: Create portable ZIP
        shell: powershell
        run: |
          Compress-Archive `
            -Path "dist\Muzammil Online Service\*" `
            -DestinationPath "Muzammil-Online-Service-PC-Windows.zip" `
            -Force

      - name: Upload Windows Application
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-PC-Windows
          path: Muzammil-Online-Service-PC-Windows.zip
          if-no-files-found: error
