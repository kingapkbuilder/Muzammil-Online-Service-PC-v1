name: Build Muzammil Online Service PC

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find and Extract PC Project
        shell: powershell
        run: |
          $zip = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "*.zip" `
            -File |
            Where-Object { $_.Name -notlike "*artifact*" } |
            Select-Object -First 1

          if (-not $zip) {
            Write-Host "ERROR: PC project ZIP nahi mila."
            exit 1
          }

          Write-Host "ZIP found:"
          Write-Host $zip.FullName

          $extract = Join-Path $env:GITHUB_WORKSPACE "pc_project"

          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }

          New-Item -ItemType Directory -Path $extract | Out-Null

          Expand-Archive `
            -Path $zip.FullName `
            -DestinationPath $extract `
            -Force

          Write-Host "ZIP extracted."

          $main = Get-ChildItem `
            -Path $extract `
            -Recurse `
            -Filter "main.py" `
            -File |
            Select-Object -First 1

          if (-not $main) {
            Write-Host "ERROR: ZIP ke andar main.py nahi mila."
            Get-ChildItem $extract -Recurse -File |
              Select-Object -First 200 FullName
            exit 1
          }

          $project = $main.Directory.FullName

          Write-Host "main.py:"
          Write-Host $main.FullName

          Write-Host "Project:"
          Write-Host $project

          "PROJECT_DIR=$project" >> $env:GITHUB_ENV
          "MAIN_FILE=$($main.FullName)" >> $env:GITHUB_ENV

      - name: Install Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip

          $requirements = Join-Path $env:PROJECT_DIR "requirements.txt"

          if (Test-Path $requirements) {
            pip install -r $requirements
          }

          pip install pyinstaller

      - name: Test Python
        shell: powershell
        run: |
          python -m py_compile "$env:MAIN_FILE"

      - name: Build Windows EXE
        shell: powershell
        run: |
          Set-Location "$env:PROJECT_DIR"

          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name "Muzammil Online Service" `
            main.py

      - name: Check EXE
        shell: powershell
        run: |
          $exe = Get-ChildItem `
            -Path "$env:PROJECT_DIR\dist" `
            -Recurse `
            -Filter "*.exe" `
            -File |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host "ERROR: EXE create nahi hua."
            Get-ChildItem "$env:PROJECT_DIR\dist" -Recurse
            exit 1
          }

          Write-Host "EXE CREATED:"
          Write-Host $exe.FullName

      - name: Create Windows ZIP
        shell: powershell
        run: |
          $appFolder = Join-Path `
            $env:PROJECT_DIR `
            "dist\Muzammil Online Service"

          Compress-Archive `
            -Path "$appFolder\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\Muzammil-Online-Service-PC-Windows.zip" `
            -Force

      - name: Upload Windows Application
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-PC-Windows
          path: Muzammil-Online-Service-PC-Windows.zip
          if-no-files-found: error
